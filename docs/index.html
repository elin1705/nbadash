<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Props Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f4f3f0; --surface:#fcfcfb; --surface-2:#f0efec; --line:#e1e0d9; --ring:rgba(11,11,11,.10);
  --text:#0b0b0b; --text-2:#52514e; --muted:#8a8984;
  --accent:#2a78d6; --accent-soft:#cde2fb;
  --good:#0ca30c; --good-text:#006300; --bad:#d03b3b; --bad-text:#b02a2a; --warn:#fab219;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --div-neg:#d03b3b; --div-mid:#f0efec; --div-pos:#2a78d6;
  --zone-text-bg:rgba(252,252,251,.88);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#111110; --surface:#1a1a19; --surface-2:#232321; --line:#2c2c2a; --ring:rgba(255,255,255,.10);
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86;
    --accent:#3987e5; --accent-soft:#16304f;
    --good:#0ca30c; --good-text:#4cc94c; --bad:#d03b3b; --bad-text:#f07a7a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --div-neg:#d03b3b; --div-mid:#383835; --div-pos:#3987e5;
    --zone-text-bg:rgba(26,26,25,.85);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111110; --surface:#1a1a19; --surface-2:#232321; --line:#2c2c2a; --ring:rgba(255,255,255,.10);
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86;
  --accent:#3987e5; --accent-soft:#16304f;
  --good:#0ca30c; --good-text:#4cc94c; --bad:#d03b3b; --bad-text:#f07a7a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --div-neg:#d03b3b; --div-mid:#383835; --div-pos:#3987e5;
  --zone-text-bg:rgba(26,26,25,.85);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono,.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:var(--accent);text-decoration:none}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:-.02em;font-size:17px;display:flex;align-items:center;gap:8px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--s2)}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:100%;flex-wrap:nowrap}
nav::-webkit-scrollbar{display:none}
nav a{white-space:nowrap;flex:none}
nav a{padding:6px 12px;border-radius:999px;color:var(--text-2);font-weight:500}
nav a.on{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--ring)}
.spacer{flex:1}
.updated{color:var(--muted);font-size:12px}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer;color:var(--text-2)}
main{max-width:1240px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:22px;letter-spacing:-.02em;margin:0 0 4px}
h2{font-size:15px;margin:0 0 10px;letter-spacing:-.01em}
.sub{color:var(--text-2);margin:0 0 16px}
.card{background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--ring);padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 1px var(--ring);cursor:pointer;color:var(--text-2);font-weight:500;font-size:13px;border:0}
.pill.on{background:var(--text);color:var(--surface);box-shadow:none}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:7px;cursor:pointer;color:var(--text-2);font-size:13px;font-weight:500}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--ring)}
input[type=text],input[type=number],select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.muted{color:var(--muted)} .t2{color:var(--text-2)}
.empty{padding:40px 16px;text-align:center;color:var(--text-2)}
.err{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border-radius:12px;padding:12px 14px;margin-bottom:14px;color:var(--text)}

/* games */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:18px}
.game{padding:12px 14px;cursor:pointer;transition:box-shadow .15s}
.game:hover,.game.sel{box-shadow:0 0 0 2px var(--accent)}
.game .tm{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.game .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}
.tag{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--text-2);font-weight:500}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:500;color:var(--muted);text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;font-size:12px}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left}
th.sorted{color:var(--text)}
td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:12.5px}
td.name{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:13px}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.up{color:var(--good-text)} .down{color:var(--bad-text)}
.chip{display:inline-flex;align-items:center;gap:3px;min-width:44px;justify-content:center;padding:1px 6px;border-radius:6px;font-size:11.5px;font-weight:600}
.chip.soft{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good-text)}
.chip.tough{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad-text)}
.chip.mid{background:var(--surface-2);color:var(--text-2)}

/* player */
.phead{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.phead .nm{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.stat .k{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:20px;font-weight:600;font-family:"JetBrains Mono",monospace;letter-spacing:-.02em}
.stat .d{font-size:11.5px;font-family:"JetBrains Mono",monospace}
.hit{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:12px 0}
.hit .stat .v{font-size:18px}
.searchwrap{position:relative;max-width:360px}
.sugg{position:absolute;top:100%;left:0;right:0;z-index:30;background:var(--surface);border-radius:10px;box-shadow:0 0 0 1px var(--ring),0 8px 24px rgba(0,0,0,.12);margin-top:4px;max-height:320px;overflow:auto}
.sugg div{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between}
.sugg div:hover,.sugg div.act{background:var(--surface-2)}
.opps{display:grid;grid-template-columns:1fr auto auto auto;gap:0;font-size:13px}
.opps>div{padding:6px 4px;border-bottom:1px solid var(--line)}
.opps .h{color:var(--muted);font-size:11.5px;font-weight:500;text-align:right}
.opps .h:first-child{text-align:left}
.opps .r{text-align:right;font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;min-width:62px}
.court-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
svg text{font-family:Inter,system-ui,sans-serif}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:6px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.grad{width:120px;height:8px;border-radius:4px;display:inline-block;vertical-align:middle;margin:0 6px}
.inj{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:5px;vertical-align:1px;font-family:Inter,sans-serif;letter-spacing:.02em}
.inj.out{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad-text)}
.inj.q{background:color-mix(in srgb,var(--warn) 25%,transparent);color:var(--text)}
.flag{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:6px;font-size:11px;font-weight:700;margin-right:3px;font-family:Inter}
.flag.w{background:color-mix(in srgb,var(--warn) 28%,transparent)} .flag.q{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad-text)} .flag.i{background:var(--accent-soft);color:var(--accent)}
.verdict{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-weight:500}
.how{margin-top:12px;font-size:13px;color:var(--text-2)} .how summary{cursor:pointer;font-weight:600;color:var(--text)} .how li{margin:4px 0}
.pill .inj{margin-left:2px}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--text);color:var(--surface);padding:7px 9px;border-radius:8px;font-size:12px;line-height:1.4;opacity:0;transition:opacity .08s;max-width:240px}
#tip b{font-weight:600}
.note{font-size:12px;color:var(--muted);margin-top:8px}
@media (max-width:640px){.phead .nm{font-size:22px} .bar{gap:8px} .updated{display:none}
  .bar{flex-wrap:nowrap} .brand{flex:none} nav{flex:1;min-width:0} .spacer{display:none}
  .calc thead{display:none} .calc table,.calc tbody{display:block}
  .calc tr{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 8px;padding:10px 0;border-bottom:1px solid var(--line)}
  .calc td{border:0;padding:2px 0;text-align:left!important;white-space:normal}
  .calc td.name{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline}
  .calc td[data-l]::before{content:attr(data-l);display:block;font-size:10.5px;color:var(--muted);font-family:Inter,sans-serif;text-transform:uppercase;letter-spacing:.04em}
  .calc td input,.calc td select{width:100%!important}
  .calc td.del{grid-column:4;text-align:right!important}
}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand"><span class="dot"></span>NBA Props Dash</div>
  <nav id="nav">
    <a href="#/today" data-r="today">Today</a>
    <a href="#/player" data-r="player">Players</a>
    <a href="#/teams" data-r="teams">Teams &amp; DvP</a>
    <a href="#/calc" data-r="calc">Bet calculator</a>
    <a href="#/safe" data-r="safe">Safe legs</a>
    <a href="#/model" data-r="model">Model check</a>
  </nav>
  <div class="spacer"></div>
  <span class="updated" id="updated"></span>
  <button class="iconbtn" id="theme" title="Toggle theme">◐</button>
</div></header>
<main id="app"><div class="empty">Loading data…</div></main>
<div id="tip"></div>

<script src="model.js"></script>
<script>
// ------------------------------------------------------------------ state
const S = { players:[], teams:[], logs:null, sched:[], matchups:null, meta:null,
  byId:{}, teamById:{}, teamByAbbr:{}, leagueZone:{} };
const TZ = 'Australia/Melbourne';
// stat definitions come from model.js so the site and the tested model always agree
const STATS = Object.fromEntries(Object.entries(Model.STATS).map(([k,v])=>[k,{label:v.label,f:g=>Model.statValue(k,g)}]));
const ZONES = ['Restricted Area','In The Paint (Non-RA)','Mid-Range','Left Corner 3','Right Corner 3','Above the Break 3'];
const ZSHORT = {'Restricted Area':'Rim','In The Paint (Non-RA)':'Paint','Mid-Range':'Mid','Left Corner 3':'L Corner','Right Corner 3':'R Corner','Above the Break 3':'Above Break 3'};

const $ = s => document.querySelector(s);
const fmt = (v,d=1) => v==null||isNaN(v) ? '–' : Number(v).toFixed(d);
const pct = (v,d=1) => v==null||isNaN(v) ? '–' : (v*100).toFixed(d)+'%';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {get(k,d){try{const v=localStorage.getItem('nbadash:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('nbadash:'+k,JSON.stringify(v))}catch(e){}}};

// ------------------------------------------------------------------ theme
(function(){const t=store.get('theme',null); if(t) document.documentElement.dataset.theme=t;})();
$('#theme').onclick=()=>{
  const cur=document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const nxt=cur==='dark'?'light':'dark'; document.documentElement.dataset.theme=nxt; store.set('theme',nxt); route();
};

// ------------------------------------------------------------------ tooltip
const tip=$('#tip');
function showTip(e,html){tip.innerHTML=html;tip.style.opacity=1;moveTip(e)}
function moveTip(e){const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;
  if(x+w>innerWidth-8)x=e.clientX-w-14; if(y+h>innerHeight-8)y=e.clientY-h-14; tip.style.left=x+'px';tip.style.top=y+'px'}
function hideTip(){tip.style.opacity=0}
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]'); if(t) showTip(e,t.dataset.tip)});
document.addEventListener('mousemove',e=>{if(e.target.closest('[data-tip]')) moveTip(e); else hideTip()});
document.addEventListener('touchstart',e=>{const t=e.target.closest('[data-tip]'); if(t) showTip(e.touches[0],t.dataset.tip); else hideTip()},{passive:true});

// ------------------------------------------------------------------ data
async function getJSON(name){
  try{const r=await fetch('data/'+name+'?v='+Date.now()); if(!r.ok) return null; return await r.json()}catch(e){return null}
}
async function load(){
  const [meta,players,teams,logs,sched,matchups,inj,calib,oppBt]=await Promise.all(
    ['meta.json','players.json','teams.json','gamelogs.json','schedule.json','matchups.json','injuries.json','calibration.json','opp_backtest.json'].map(getJSON));
  S.oppBt=oppBt;
  S.meta=meta; S.players=players||[]; S.teams=teams||[]; S.logs=logs; S.sched=sched||[]; S.matchups=matchups; S.calib=calib;
  setInjuries(inj?.list||[], inj?.updated, 'saved');
  loadLiveInjuries();
  S.players.forEach(p=>S.byId[p.id]=p);
  S.teams.forEach(t=>{S.teamById[t.id]=t; if(t.abbr) S.teamByAbbr[t.abbr]=t});
  // league average allowed FG% by zone
  ZONES.forEach(z=>{let m=0,a=0; S.teams.forEach(t=>{const v=t.zones?.season?.allowed?.[z]; if(v){m+=v.FGM||0;a+=v.FGA||0}});
    S.leagueZone[z]=a?m/a:null});
  if(meta?.updated){
    const d=new Date(meta.updated);
    $('#updated').textContent='Updated '+d.toLocaleString('en-AU',{timeZone:TZ,weekday:'short',hour:'numeric',minute:'2-digit'});
  }
  route();
}

// ------------------------------------------------------------------ injuries
const ESPN_ABBR={GS:'GSW',NY:'NYK',NO:'NOP',SA:'SAS',UTAH:'UTA',WSH:'WAS'};
const normName=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
  .replace(/[.'’-]/g,'').replace(/\b(jr|sr|ii|iii|iv|v)\b/g,'').replace(/\s+/g,' ').trim();
function setInjuries(list, updated, source){
  S.inj={}; S.injUpdated=updated; S.injSource=source;
  const byName={}; S.players.forEach(p=>{(byName[normName(p.name)]=byName[normName(p.name)]||[]).push(p)});
  list.forEach(i=>{const c=byName[normName(i.name)]; if(!c) return;
    const p=c.length===1?c[0]:(c.find(x=>x.team===i.team)||c[0]); S.inj[p.id]=i});
}
async function loadLiveInjuries(){
  try{
    const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/injuries',{cache:'no-store'});
    if(!r.ok) return; const d=await r.json(); const list=[];
    (d.injuries||[]).forEach(t=>(t.injuries||[]).forEach(i=>{const a=i.athlete||{}; const ab=a.team?.abbreviation;
      list.push({name:a.displayName,team:ESPN_ABBR[ab]||ab,status:i.status,comment:i.shortComment,date:i.date,returnDate:i.details?.returnDate,type:i.details?.type})}));
    if(list.length){setInjuries(list,new Date().toISOString(),'live'); route()}
  }catch(e){/* offline or blocked: keep the saved copy */}
}
const injOf=pid=>S.inj?.[pid];
const isOut=pid=>/^(out|doubtful)/i.test(injOf(pid)?.status||'');
const isRisky=pid=>/^(questionable|day-to-day|probable|gtd)/i.test(injOf(pid)?.status||'');
function injBadge(pid){
  const i=injOf(pid); if(!i) return '';
  const cls=/^out/i.test(i.status)?'out':/^doubtful/i.test(i.status)?'out':'q';
  const short=/^out/i.test(i.status)?'OUT':/^doubtful/i.test(i.status)?'DOUBT':/^questionable/i.test(i.status)?'Q':/^probable/i.test(i.status)?'PROB':'DTD';
  return `<span class="inj ${cls}" data-tip="<b>${esc(i.status)}</b>${i.type?' · '+esc(i.type):''}<br>${esc(i.comment||'')}">${short}</span>`;
}
/** Teammates ruled out (Out/Doubtful) for a player, as model inputs. */
function matesOutFor(p, sel){
  const mates=S.players.filter(x=>x.teamId===p.teamId&&x.id!==p.id&&(x.season?.MIN||0)>=12);
  const chosen=sel? mates.filter(x=>sel.has(x.id)) : mates.filter(x=>isOut(x.id));
  return chosen.map(x=>({id:x.id,name:x.name,games:allGames(x.id)}));
}
function oppFactorFor(p,oppT,stat,games){
  if(!oppT) return {factor:1,parts:[]};
  const g=(games||allGames(p.id)).filter(x=>x.season==='current').slice(0,15);
  const rates={}; ['pts','reb','ast','fg3m','stl','blk','tov','fga'].forEach(k=>rates[k]=g.reduce((a,x)=>a+(x[k]||0),0)/(g.length||1)||0.01);
  return Model.opponentFactor(stat,p.grp,oppT,S.teams,rates);
}
function teamLastPlayed(abbr){
  let last=null; S.players.forEach(p=>{if(p.team!==abbr) return; const g=S.logs?.current?.[p.id]?.[0]; if(g&&(!last||g[0]>last)) last=g[0]}); return last;
}
function isB2B(g,teamId){
  const t=S.teamById[teamId]; if(!t) return false; const last=teamLastPlayed(t.abbr); if(!last) return false;
  const etDate=new Date(new Date(g.utc).getTime()-5*3600e3).toISOString().slice(0,10);
  return (new Date(etDate)-new Date(last))/864e5===1;
}

function gameRows(pid, which='current'){
  const cols=S.logs?.cols; const arr=S.logs?.[which]?.[pid]; if(!cols||!arr) return [];
  return arr.map(r=>{const o={}; cols.forEach((c,i)=>o[c]=r[i]); o.season=which; return o});
}
function allGames(pid){return [...gameRows(pid,'current'),...gameRows(pid,'previous')]}

function nextGameFor(teamId){
  const now=Date.now()-3*3600e3;
  return S.sched.find(g=>(g.home===teamId||g.away===teamId) && new Date(g.utc).getTime()>=now);
}
function oppOf(g,teamId){return g.home===teamId?g.away:g.home}
function melDate(utc){return new Date(utc).toLocaleDateString('en-CA',{timeZone:TZ})}
function melTime(utc){return new Date(utc).toLocaleTimeString('en-AU',{timeZone:TZ,hour:'numeric',minute:'2-digit'})}
function melDay(d){return new Date(d+'T12:00:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'})}

function dvpFor(teamId, grp, stat, span='season'){
  const d=S.teamById[teamId]?.dvp?.[span]?.[grp]; if(!d) return null;
  return {val:d[stat], rank:d.rank?.[stat], gp:S.teamById[teamId]?.dvp?.[span]?.gp};
}
function chip(r){
  if(!r||r.rank==null) return '<span class="chip mid">–</span>';
  const n=r.rank, cls=n>=21?'soft':n<=10?'tough':'mid', ic=n>=21?'▲':n<=10?'▼':'';
  return `<span class="chip ${cls}" data-tip="Allows ${fmt(r.val)} / game to this position<br>Rank ${n} of 30 (30 = most allowed)">${ic}${n}</span>`;
}
function delta(now,base,d=1){
  if(now==null||base==null) return '';
  const x=now-base; if(Math.abs(x)<Math.pow(10,-d)/2) return '<span class="muted">±0</span>';
  return `<span class="${x>0?'up':'down'}">${x>0?'▲':'▼'}${Math.abs(x).toFixed(d)}</span>`;
}

// ------------------------------------------------------------------ router
function route(){
  const h=location.hash.replace(/^#\/?/,'')||'today';
  const [r,...rest]=h.split('/');
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===r));
  hideTip();
  const app=$('#app');
  if(!S.meta && !S.players.length){app.innerHTML=noData(); return}
  const banner=errBanner();
  if(r==='player') app.innerHTML=banner+viewPlayer(rest[0],rest[1]);
  else if(r==='teams') app.innerHTML=banner+viewTeams(rest[0]);
  else if(r==='calc') app.innerHTML=banner+viewCalc();
  else if(r==='safe') app.innerHTML=banner+viewSafe(rest[0]);
  else if(r==='model') app.innerHTML=banner+viewModel();
  else app.innerHTML=banner+viewToday(rest[0]);
  bind(r);
}
addEventListener('hashchange',route);

function noData(){
  return `<div class="card empty"><h2>No data yet</h2>
  <p>The first data refresh hasn't finished. Once the <b>Update NBA data</b> workflow runs on GitHub, refresh this page.</p></div>`;
}
function errBanner(){
  const e=S.meta?.errors; if(!e||!e.length) return '';
  return `<div class="err"><b>Some data couldn't be refreshed:</b> ${e.map(x=>esc(x.section)).join(', ')}. Everything else is current.</div>`;
}

// ------------------------------------------------------------------ TODAY
let todaySort=store.get('todaySort',{k:'soft',d:-1});
let todayStat=store.get('todayStat','PTS');
let todayMin=store.get('todayMin',20);
function viewToday(dateArg){
  const dates=[...new Set(S.sched.map(g=>melDate(g.utc)))].sort();
  if(!dates.length) return `<div class="card empty">No upcoming games in the schedule window.</div>`;
  const today=new Date().toLocaleDateString('en-CA',{timeZone:TZ});
  const date=dateArg&&dates.includes(dateArg)?dateArg:(dates.find(d=>d>=today)||dates[dates.length-1]);
  const games=S.sched.filter(g=>melDate(g.utc)===date);
  const selGame=store.get('selGame',null);
  const activeGames=games.filter(g=>!selGame||g.id===selGame).length?games.filter(g=>!selGame||g.id===selGame):games;

  let html=`<h1>Games · ${melDay(date)}</h1><p class="sub">Times in Melbourne time. Click a game to filter the board.</p>
  <div class="row" style="margin-bottom:12px">${dates.map(d=>`<a class="pill ${d===date?'on':''}" href="#/today/${d}">${melDay(d)}</a>`).join('')}</div>
  <div class="games">${games.map(g=>gameCard(g,selGame===g.id)).join('')}</div>`;

  // board
  const rowsArr=[];
  activeGames.forEach(g=>{[[g.away,g.home],[g.home,g.away]].forEach(([tid,opp])=>{
    S.players.filter(p=>p.teamId===tid && (p.season?.MIN||0)>=todayMin && (p.season?.GP||0)>=2).forEach(p=>{
      rowsArr.push(boardRow(p,opp,g));
    });
  })});
  const keyOf={player:r=>r.p.name, min:r=>r.p.season?.MIN, szn:r=>r.szn, l5:r=>r.l5, l10:r=>r.l10, trend:r=>(r.l5??0)-(r.szn??0),
    opps:r=>r.opps, soft:r=>r.dvp?.rank, oppVal:r=>r.dvp?.val, hit:r=>r.hit};
  const f=keyOf[todaySort.k]||keyOf.soft;
  if(todaySort.k==='player') rowsArr.sort((a,b)=>a.p.name.localeCompare(b.p.name)*todaySort.d);
  else if(todaySort.d===-1) rowsArr.sort((a,b)=>(f(b)??-1e9)-(f(a)??-1e9));
  else rowsArr.sort((a,b)=>(f(a)??1e9)-(f(b)??1e9));

  const st=todayStat;
  const oppLabel = st==='REB'?'Reb chances':st==='AST'?'Potential ast':st==='FG3M'?'3PA':'FGA';
  const th=(k,l,cls='')=>`<th data-sort="${k}" class="${cls} ${todaySort.k===k?'sorted':''}">${l}${todaySort.k===k?(todaySort.d===-1?' ↓':' ↑'):''}</th>`;
  html+=`<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px">
    <h2 style="margin:0">Player board ${selGame?'<button class="pill" id="clearGame">Show all games ✕</button>':''}</h2>
    <div class="row"><div class="seg" id="minSeg">${[14,20,25,30].map(m=>`<button data-m="${m}" class="${m===todayMin?'on':''}">${m}+ min</button>`).join('')}</div>
    <div class="seg" id="statSeg">${['PTS','REB','AST','FG3M','PRA','STL','BLK'].map(s=>`<button data-s="${s}" class="${s===st?'on':''}">${s==='FG3M'?'3PM':s}</button>`).join('')}</div></div></div>
    <div class="tw"><table><thead><tr>${th('player','Player','l')}<th class="l">Opp</th>${th('min','MIN')}${th('szn','Season')}${th('l10','L10')}${th('l5','L5')}${th('trend','L5 vs szn')}${th('opps',oppLabel+' L5')}${th('hit','Over szn avg L10')}${th('oppVal','Opp allows')}${th('soft','DvP rank')}</tr></thead>
    <tbody>${rowsArr.map(r=>`<tr class="click" data-href="#/player/${r.p.id}/${r.oppAbbr}">
      <td class="name">${esc(r.p.name)} ${injBadge(r.p.id)} <span class="tag">${esc(r.p.team)} · ${esc(r.p.grp||'?')}</span></td>
      <td class="l">${r.home?'vs':'@'} ${esc(r.oppAbbr)}</td>
      <td>${fmt(r.p.season?.MIN)}</td><td>${fmt(r.szn)}</td><td>${fmt(r.l10)}</td><td>${fmt(r.l5)}</td>
      <td>${delta(r.l5,r.szn)}</td><td>${fmt(r.opps)}</td><td>${r.hitTxt}</td><td>${fmt(r.dvp?.val)}</td><td>${chip(r.dvp)}</td></tr>`).join('')}</tbody></table></div>
    <p class="note">DvP rank: how much the opponent allows to this player's position (G/F/C) per game. 30 = allows the most (▲ soft matchup), 1 = allows the least (▼ tough). Click any row for the full player breakdown.</p></div>`;
  return html;
}
function boardRow(p,opp,g){
  const st=todayStat, key=st==='FG3M'?'FG3M':st;
  const val=o=>!o?null: st==='PRA'?(o.PTS+o.REB+o.AST): o[key];
  const tr=p.track||{};
  const opps = st==='REB'?tr.l5?.REB_CHANCES : st==='AST'?tr.l5?.POTENTIAL_AST : st==='FG3M'?p.l5?.FG3A : p.l5?.FGA;
  const games=gameRows(p.id).slice(0,10); const szn=val(p.season);
  const hits=games.filter(x=>STATS[st].f(x)>szn).length;
  const oppAbbr=S.teamById[opp]?.abbr || (g.home===opp?g.homeTri:g.awayTri);
  return {p, opp, oppAbbr, home:g.home===p.teamId, szn, l10:val(p.l10), l5:val(p.l5), opps,
    hit:games.length?hits/games.length:null, hitTxt:games.length?`${hits}/${games.length}`:'–',
    dvp:dvpFor(opp,p.grp,st==='FG3M'?'FG3M':st)};
}
function gameCard(g,sel){
  const a=S.teamById[g.away], h=S.teamById[g.home];
  const line=(t,tri,score)=>`<div class="tm"><span>${esc(t?.abbr||tri)} <span class="muted" style="font-weight:400">${t?.base?`${t.base.W}-${t.base.L}`:''}</span></span><span class="num">${score??''}</span></div>`;
  const pace=a?.adv?.PACE&&h?.adv?.PACE?((a.adv.PACE+h.adv.PACE)/2):null;
  return `<div class="card game ${sel?'sel':''}" data-game="${g.id}">
    ${line(a,g.awayTri,g.awayScore||'')}${line(h,g.homeTri,g.homeScore||'')}
    <div class="meta"><span>${melTime(g.utc)}${g.status&&!/ET|pm|am/i.test(g.status)?' · '+esc(g.status):''}</span><span data-tip="Average pace of both teams (possessions per 48)">Pace ${fmt(pace)}</span></div></div>`;
}

let propStat=store.get('propStat','PTS');
let propLines=store.get('propLines',{});
let propN=store.get('propN',20);
function viewPlayer(pid,oppArg){
  let html=`<div class="row" style="margin-bottom:16px"><div class="searchwrap" style="flex:1"><input type="text" id="psearch" placeholder="Search a player…" autocomplete="off" style="width:100%"><div class="sugg" id="sugg" hidden></div></div></div>`;
  const p=S.byId[pid];
  if(!p){
    const top=[...S.players].sort((a,b)=>(b.season?.PTS||0)-(a.season?.PTS||0)).slice(0,40);
    return html+`<div class="card"><h2>Top scorers</h2><div class="tw"><table><thead><tr><th class="l">Player</th><th>GP</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>3PM</th></tr></thead><tbody>
    ${top.map(p=>`<tr class="click" data-href="#/player/${p.id}"><td class="name">${esc(p.name)} <span class="tag">${esc(p.team)}</span></td><td>${p.season?.GP??'–'}</td><td>${fmt(p.season?.MIN)}</td><td>${fmt(p.season?.PTS)}</td><td>${fmt(p.season?.REB)}</td><td>${fmt(p.season?.AST)}</td><td>${fmt(p.season?.FG3M)}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
  // opponent: arg, else next game
  const ng=nextGameFor(p.teamId);
  let oppT = oppArg ? S.teamByAbbr[oppArg] : (ng ? S.teamById[oppOf(ng,p.teamId)] : null);
  const s=p.season||{}, l10=p.l10||{}, l5=p.l5||{};
  const box=(k,label,d=1)=>`<div class="stat"><div class="k">${label}</div><div class="v">${fmt(s[k],d)}</div><div class="d"><span class="muted">L5 ${fmt(l5[k],d)}</span> ${delta(l5[k],s[k],d)}</div></div>`;
  html+=`<div class="phead"><div><div class="muted">${esc(p.team)} · ${esc(p.pos||'')} ${p.age?'· age '+Math.round(p.age):''}</div><div class="nm">${esc(p.name)} ${injBadge(p.id)}</div></div>
    <div class="t2">${ng?`Next: ${ng.home===p.teamId?'vs':'@'} <b>${esc(S.teamById[oppOf(ng,p.teamId)]?.abbr||'')}</b> · ${melDay(melDate(ng.utc))} ${melTime(ng.utc)}`:''}</div></div>
  <div class="card" style="margin-bottom:14px"><div class="stats">${box('MIN','Min')}${box('PTS','Pts')}${box('REB','Reb')}${box('AST','Ast')}${box('FG3M','3PM')}${box('FG3A','3PA')}${box('FGA','FGA')}${box('STL','Stl')}${box('BLK','Blk')}${box('TOV','Tov')}
    <div class="stat"><div class="k">Usage</div><div class="v">${pct(p.adv?.USG_PCT,0)}</div><div class="d muted">TS ${pct(p.adv?.TS_PCT,0)}</div></div>
    <div class="stat"><div class="k">GP</div><div class="v">${s.GP??'–'}</div><div class="d muted">L10 MIN ${fmt(l10.MIN)}</div></div></div></div>`;

  // prop tool
  html+=propTool(p,oppT);
  // opps + zones
  html+=`<div class="grid g2" style="margin-top:14px">${oppPanel(p)}${matchupDvp(p,oppT)}</div>`;
  html+=`<div class="card" style="margin-top:14px">${zonesPanel(p,oppT)}</div>`;
  html+=`<div class="grid g2" style="margin-top:14px">${defenderPanel(p,oppT)}${h2hPanel(p,oppT)}</div>`;
  return html;
}

let propOdds=store.get('propOdds',{});
S.mateSel={};
function getMateSel(p){
  if(!S.mateSel[p.id]) S.mateSel[p.id]=new Set(S.players.filter(x=>x.teamId===p.teamId&&x.id!==p.id&&isOut(x.id)).map(x=>x.id));
  return S.mateSel[p.id];
}
function defaultLine(p,st){
  const g=gameRows(p.id).slice(0,15); if(!g.length) return 0.5;
  const v=g.reduce((a,x)=>a+STATS[st].f(x),0)/g.length; return Math.max(0.5,Math.floor(v)+.5);
}
function propTool(p,oppT){
  const st=propStat;
  const games=allGames(p.id);
  const cur=gameRows(p.id), prev=gameRows(p.id,'previous');
  const lineKey=p.id+':'+st;
  const line=propLines[lineKey]??defaultLine(p,st);
  const val=g=>STATS[st].f(g);
  const rate=arr=>{if(!arr.length) return null; const h=arr.filter(g=>val(g)>line).length; return {h,n:arr.length,r:h/arr.length}};
  const vsOpp=oppT?games.filter(g=>g.opp===oppT.abbr):[];
  // games without the selected teammates
  const sel=getMateSel(p); const mates=matesOutFor(p,sel);
  let withoutGames=null;
  if(mates.length){
    withoutGames=games;
    mates.forEach(m=>{const w=Model.withoutSplit(games,m.games,st); withoutGames=w?withoutGames.filter(g=>w.games.some(x=>x.gid===g.gid)):[]});
  }
  const blocks=[['L5',rate(cur.slice(0,5))],['L10',rate(cur.slice(0,10))],['L20',rate(games.slice(0,20))],['Season',rate(cur)],['Last season',rate(prev)],
    ['Home',rate(cur.filter(g=>g.home))],['Away',rate(cur.filter(g=>!g.home))],[oppT?`vs ${oppT.abbr}`:'vs opp',rate(vsOpp)]];
  if(withoutGames) blocks.push([`Without ${mates.map(m=>m.name.split(' ').slice(-1)[0]).join(' + ')}`,rate(withoutGames)]);
  const hb=([k,r])=>`<div class="stat"><div class="k" title="${esc(k)}" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(k)}</div><div class="v">${r?Math.round(r.r*100)+'%':'–'}</div><div class="d muted">${r?`${r.h}/${r.n} over`:'no games'}</div></div>`;
  const shown=games.slice(0,propN).reverse();
  return `<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:6px">
    <h2 style="margin:0">Prop checker</h2>
    <div class="row">
      <select id="propStat">${Object.entries(STATS).map(([k,v])=>`<option value="${k}" ${k===st?'selected':''}>${v.label}</option>`).join('')}</select>
      <label class="t2">Line <input type="number" id="propLine" step="0.5" value="${line}" style="width:80px"></label>
      <div class="seg" id="propN">${[10,20,40].map(n=>`<button data-n="${n}" class="${n===propN?'on':''}">L${n}</button>`).join('')}</div>
    </div></div>
    <div class="hit">${blocks.map(hb).join('')}</div>
    ${barChart(shown,val,line,oppT)}
    <div class="legend"><span><i style="background:var(--good)"></i>✓ Over line</span><span><i style="background:var(--bad)"></i>✗ Under line</span><span><i style="background:var(--text-2);height:2px"></i>Line ${line}</span><span class="muted">Darker outline = vs ${oppT?esc(oppT.abbr):'opponent'} · striped = last season</span></div></div>
    ${pricingPanel(p,oppT,st,line,games,mates)}`;
}

function pricingPanel(p,oppT,st,line,games,mates){
  const key=p.id+':'+st+':'+line, od=propOdds[key]||{};
  const of=oppFactorFor(p,oppT,st,games);
  const r=Model.price({games,stat:st,line,overOdds:od.o,underOdds:od.u,oppFactor:of.factor,mates});
  const teammates=S.players.filter(x=>x.teamId===p.teamId&&x.id!==p.id&&(x.season?.MIN||0)>=12).sort((a,b)=>(b.season?.MIN||0)-(a.season?.MIN||0));
  const sel=getMateSel(p);
  const mateChips=teammates.map(x=>`<button class="pill ${sel.has(x.id)?'on':''}" data-mate="${x.id}">${esc(x.name)} ${injBadge(x.id)}</button>`).join('');
  let h=`<div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Price it</h2>
    <div class="row"><label class="t2">Over odds <input type="number" id="oddsO" step="0.01" min="1.01" placeholder="e.g. 1.87" value="${od.o??''}" style="width:96px"></label>
    <label class="t2">Under odds <input type="number" id="oddsU" step="0.01" min="1.01" placeholder="optional" value="${od.u??''}" style="width:96px"></label></div></div>
    <div class="t2" style="font-size:12.5px;margin-bottom:6px">Teammates out <span class="muted">(auto-ticked from the injury report · tap to change)</span></div>
    <div class="row" style="gap:6px;margin-bottom:14px">${mateChips||'<span class="muted">–</span>'}</div>`;
  if(!r){return h+`<div class="empty">Not enough games to project this player yet.</div></div>`}
  const pr=r.proj, pb=r.probs, mk=r.market;
  const evTxt=(x)=>x==null?'–':`<span class="${x>0?'up':'down'}">${x>0?'+':''}${(x*100).toFixed(1)}%</span>`;
  const big=(k,v,sub)=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="d muted">${sub||''}</div></div>`;
  h+=`<div class="stats">
    ${big('Projection',fmt(pr.mean),'± '+fmt(pr.sd)+' typical swing')}
    ${big('Model over',pct(pb.over,0),'fair odds '+fmt(r.fairOver,2))}
    ${big('Model under',pct(pb.under,0),'fair odds '+fmt(r.fairUnder,2))}
    ${big('Book over',mk?pct(mk.over,0):'–',mk?(mk.twoWay?'margin removed ('+pct(mk.margin,1)+' margin)':'includes margin'):'enter odds')}
    ${big('Edge over',r.over?.edge!=null?`<span class="${r.over.edge>0?'up':'down'}">${r.over.edge>0?'+':''}${(r.over.edge*100).toFixed(1)}</span>`:'–','% points vs book')}
    ${big('EV over',evTxt(r.over?.ev),r.over?'per $1 · ¼ Kelly '+Math.max(0,r.over.kelly/4*100).toFixed(1)+'%':'')}
    ${big('EV under',evTxt(r.under?.ev),r.under?'per $1 · ¼ Kelly '+Math.max(0,r.under.kelly/4*100).toFixed(1)+'%':'')}
  </div>`;
  // verdict
  let verdict='Enter the bookie\'s odds to see if there\'s value.';
  const best=[r.over&&['Over',r.over,od.o],r.under&&['Under',r.under,od.u]].filter(Boolean).sort((a,b)=>b[1].ev-a[1].ev)[0];
  if(best){
    const [side,x]=best;
    verdict = x.ev>0.08 ? `⚠️ ${side} shows +${(x.ev*100).toFixed(1)}% — unusually big. Double-check injury news, minutes limits and that the line is current before trusting it.`
      : x.ev>0.03 ? `✓ Value on the ${side}: +${(x.ev*100).toFixed(1)}% expected return.`
      : x.ev>0 ? `Thin edge on the ${side} (+${(x.ev*100).toFixed(1)}%) — inside the model's error margin. Probably pass.`
      : `No value — the bookie's price is better than the model's view on both sides.`;
  }
  const flags=[];
  if(isOut(p.id)) flags.push(`${esc(p.name)} is listed <b>${esc(injOf(p.id).status)}</b>.`);
  else if(isRisky(p.id)) flags.push(`${esc(p.name)} is listed <b>${esc(injOf(p.id).status)}</b> — minutes could be limited.`);
  if(pr.sampleCurrent<8) flags.push(`Only ${pr.sampleCurrent} games this season — leaning on last season (weighted down).`);
  if(mates.some(m=>!pr.mates.find(n=>n.name===m.name)?.n)) flags.push('No past games without some ticked teammates, so their absence isn\'t adjusted for.');
  h+=`<div class="verdict">${verdict}</div>${flags.length?`<div class="note" style="color:var(--text-2)">⚠ ${flags.join(' ')}</div>`:''}`;
  // breakdown
  const mateLines=pr.mates.filter(m=>m.n).map(m=>`<li>Without ${esc(m.name)} (${m.n} games): minutes ×${fmt(m.minFactor,2)}, ${STATS[st].label.toLowerCase()} per minute ×${fmt(m.rateFactor,2)} <span class="muted">(raw ×${fmt(m.minRatio,2)} / ×${fmt(m.rateRatio,2)}, shrunk for sample size)</span></li>`).join('');
  h+=`<details class="how"><summary>How this was calculated</summary><ol>
    <li>Expected minutes: <b>${fmt(pr.baseMinutes)}</b> (recent games weighted most)${pr.factors.minutes!==1?` → <b>${fmt(pr.minutes)}</b> after teammates out`:''}</li>
    <li>${STATS[st].label} per minute: <b>${fmt(pr.rate,3)}</b> over ${pr.sample} games (${pr.sampleCurrent} this season; last season counts 60%)</li>
    ${mateLines}
    <li>Opponent: ${oppT?`${esc(oppT.abbr)} vs ${esc(p.grp||'?')} ×${fmt(pr.factors.opp,3)}`+(of.parts.length?` <span class="muted">(${of.parts.map(x=>`${x.part.toUpperCase()} allowed ${fmt(x.allowed)} per 48 ${esc(p.grp)}-minutes vs avg ${fmt(x.league)}`).join(', ')}; shrunk over ${of.gp} games, capped at ±10%)</span>`:''):'none selected'}</li>
    <li>Projection = minutes × rate × adjustments = <b>${fmt(pr.mean,2)}</b></li>
    <li>Spread: game-to-game variation from his logs, +15% for uncertainty, plus a 5% chance of a "dud" game (injury exit, foul trouble, blowout). Both tuned so that "95%" really hits ~95% in backtests.</li>
    <li>P(over ${line}) = <b>${pct(pb.over,1)}</b>${pb.push>0.001?`, push ${pct(pb.push,1)}`:''}. EV = P(win) × (odds − 1) − P(lose).</li>
  </ol><p class="note">Not included: confirmed starting lineups after the injury report, minutes restrictions, coaching changes, rest days. Treat the number as a starting point, not gospel.</p></details></div>`;
  return h;
}

function barChart(games,val,line,oppT){
  if(!games.length) return '<div class="empty">No games logged yet.</div>';
  const W=Math.max(340,Math.min(900,innerWidth-64)),H=W<600?200:230,pl=30,pr=6,pt=18,pb=34;
  if(W<600 && games.length>12) games=games.slice(-12);
  const max=Math.max(line*1.25,...games.map(val),1);
  const nice=Math.ceil(max/4)*4;
  const bw=(W-pl-pr)/games.length, gap=Math.min(6,bw*.25);
  const y=v=>pt+(H-pt-pb)*(1-v/nice);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-height:280px" role="img" aria-label="Game by game results against the line">
  <defs><pattern id="stripe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="transparent"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--surface)" stroke-width="2" opacity=".55"/></pattern></defs>`;
  for(let i=0;i<=4;i++){const v=nice*i/4; s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`}
  games.forEach((g,i)=>{
    const v=val(g), over=v>line, x=pl+i*bw+gap/2, w=bw-gap, top=y(Math.max(v,0)), hgt=Math.max(y(0)-top,1.5);
    const vs=oppT&&g.opp===oppT.abbr;
    const r=Math.min(4,w/2);
    const path=`M${x},${y(0)} V${top+r} Q${x},${top} ${x+r},${top} H${x+w-r} Q${x+w},${top} ${x+w},${top+r} V${y(0)} Z`;
    const tipTxt=`<b>${esc(g.date)}</b> ${g.home?'vs':'@'} ${esc(g.opp)} (${esc(g.wl||'')})<br>${fmt(v,v%1?1:0)} — ${over?'✓ Over':'✗ Under'} ${line}<br>${fmt(g.min,0)} min · ${g.pts}p ${g.reb}r ${g.ast}a ${g.fg3m}×3${g.season==='previous'?'<br><i>last season</i>':''}`;
    s+=`<g data-tip="${esc(tipTxt)}"><rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent"/>
      <path d="${path}" fill="${over?'var(--good)':'var(--bad)'}" ${vs?'stroke="var(--text)" stroke-width="2"':''}/>
      ${g.season==='previous'?`<path d="${path}" fill="url(#stripe)"/>`:''}
      ${bw>18?`<text x="${x+w/2}" y="${top-4}" text-anchor="middle" font-size="10.5" fill="var(--text-2)">${fmt(v,v%1?1:0)}</text>`:''}
      ${bw>26?`<text x="${x+w/2}" y="${H-pb+14}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(g.opp)}</text><text x="${x+w/2}" y="${H-pb+26}" text-anchor="middle" font-size="9" fill="var(--muted)">${esc(g.date.slice(5))}</text>`:''}</g>`;
  });
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(line)}" y2="${y(line)}" stroke="var(--text-2)" stroke-width="2" stroke-dasharray="5 4"/>`;
  return s+'</svg>';
}

function matchupDvp(p,oppT){

  h+=`</tbody></table></div>`;
  const a=oppT.adv||{}, a10=oppT.adv_l10||{};
  const rk=(k,asc)=>{const arr=S.teams.map(t=>t.adv?.[k]).filter(v=>v!=null).sort((x,y)=>asc?x-y:y-x); return arr.indexOf(a[k])+1};
  h+=`<div class="stats" style="margin-top:12px">
    <div class="stat"><div class="k">Pace</div><div class="v">${fmt(a.PACE)}</div><div class="d muted">#${rk('PACE')||'–'} fastest · L10 ${fmt(a10.PACE)}</div></div>
    <div class="stat"><div class="k">Def rating</div><div class="v">${fmt(a.DEF_RATING)}</div><div class="d muted">#${rk('DEF_RATING',true)||'–'} best · L10 ${fmt(a10.DEF_RATING)}</div></div>
    <div class="stat"><div class="k">Opp pts</div><div class="v">${fmt(oppT.opp?.OPP_PTS)}</div><div class="d muted">L10 ${fmt(oppT.opp_l10?.OPP_PTS)}</div></div>
    <div class="stat"><div class="k">Opp reb</div><div class="v">${fmt(oppT.opp?.OPP_REB)}</div><div class="d muted">L10 ${fmt(oppT.opp_l10?.OPP_REB)}</div></div></div>`;
  return h+`<p class="note">Rank 30 = allows the most to this position (best matchup). Positions are NBA.com's G / F / C.</p></div>`;
}

// ---------- court
function divColor(diff){ // diff in FG% points, -0.12..+0.12
  const t=Math.max(-1,Math.min(1,diff/0.10));
  const mix=(a,b,k)=>`color-mix(in oklab, ${b} ${Math.round(k*100)}%, ${a})`;
  return t>=0?mix('var(--div-mid)','var(--div-pos)',t*.9):mix('var(--div-mid)','var(--div-neg)',-t*.9);
}
function court(zdata, mode, title){
  // zdata: {zone:{FGM,FGA,FG_PCT}}; mode 'off' (player shooting) or 'def' (allowed)
  const W=500,H=420;
  const shapes={
    'Above the Break 3':`M0,0 H500 V${H} H0 Z`,
    'Left Corner 3':`M0,0 H30 V140 H0 Z`,
    'Right Corner 3':`M470,0 H500 V140 H470 Z`,
    'Mid-Range':`M30,0 V140 A237.5 237.5 0 0 0 470,140 V0 Z`,
    'In The Paint (Non-RA)':`M170,0 H330 V190 H170 Z`,
    'Restricted Area':`M210,0 V52.5 A40 40 0 0 0 290,52.5 V0 Z`,
  };
  const labelPos={'Above the Break 3':[250,350],'Left Corner 3':[15,75],'Right Corner 3':[485,75],'Mid-Range':[95,180],'In The Paint (Non-RA)':[250,150],'Restricted Area':[250,40]};
  const order=['Above the Break 3','Left Corner 3','Right Corner 3','Mid-Range','In The Paint (Non-RA)','Restricted Area'];
  // mid-range label: centre-left between paint and arc
  let s=`<svg viewBox="-4 -4 ${W+8} ${H+8}" width="100%" style="display:block;max-width:440px;margin:0 auto" role="img" aria-label="${esc(title)}">`;
  order.forEach(z=>{
    const v=zdata?.[z]; const lg=S.leagueZone[z];
    const fg=v&&v.FGA?v.FGM/v.FGA:null;
    const fill=fg!=null&&lg!=null?divColor(fg-lg):'var(--surface-2)';
    const tipTxt=`<b>${z}</b><br>${v?`${fmt(v.FGM)}/${fmt(v.FGA)} per game · ${pct(fg)}`:'no attempts'}<br>League avg ${pct(lg)}${fg!=null&&lg!=null?` (${fg-lg>=0?'+':''}${((fg-lg)*100).toFixed(1)})`:''}`;
    s+=`<path d="${shapes[z]}" fill="${fill}" stroke="var(--surface)" stroke-width="3" data-tip="${esc(tipTxt)}"/>`;
  });
  // court lines (recessive)
  s+=`<g fill="none" stroke="var(--text-2)" stroke-opacity=".35" stroke-width="1.5" pointer-events="none">
    <circle cx="250" cy="52.5" r="7.5"/><line x1="220" y1="40" x2="280" y2="40"/><circle cx="250" cy="190" r="60" stroke-dasharray="4 4"/></g>`;
  order.forEach(z=>{
    const v=zdata?.[z]; const fg=v&&v.FGA?v.FGM/v.FGA:null; const [x,yy]=labelPos[z];
    const corner=z.includes('Corner');
    const t1=pct(fg,0), t2=v?`${fmt(v.FGA)} FGA`:'';
    if(corner){
      s+=`<g pointer-events="none" transform="translate(${x},${yy}) rotate(-90)"><text text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)" y="4">${t1}</text></g>`;
    } else {
      s+=`<g pointer-events="none"><rect x="${x-38}" y="${yy-16}" width="76" height="34" rx="7" fill="var(--zone-text-bg)"/>
      <text x="${x}" y="${yy}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--text)">${t1}</text>
      <text x="${x}" y="${yy+13}" text-anchor="middle" font-size="10.5" fill="var(--text-2)">${t2}</text></g>`;
    }
  });
  return s+'</svg>';
}

function defenderPanel(p,oppT){
  const M=S.matchups; if(!M) return `<div class="card"><h2>Defender matchups</h2><div class="empty">Matchup data not loaded.</div></div>`;
  const ci=Object.fromEntries(M.cols.map((c,i)=>[c,i]));

  const pick=(arr,lbl)=>(arr||[]).filter(r=>r[ci.off]===p.id&&(!oppT||oppIds.has(r[ci.def]))).map(r=>({r,lbl}));
  const list=[...pick(M.current,'This season'),...pick(M.previous,'Last season')].sort((a,b)=>b.r[ci.poss]-a.r[ci.poss]).slice(0,12);
  let h=`<div class="card"><h2>Who guards him${oppT?` · ${esc(oppT.abbr)} defenders`:''}</h2>`;
  if(!list.length) return h+`<div class="empty">No tracked matchups${oppT?' vs current '+esc(oppT.abbr)+' players':''} yet.</div></div>`;
  h+=`<div class="tw"><table><thead><tr><th class="l">Defender</th><th class="l">Season</th><th>Poss</th><th>Pts</th><th>Pts/100</th><th>FG</th><th>3P</th><th>Ast</th></tr></thead><tbody>`;
  list.forEach(({r,lbl})=>{const pp=r[ci.poss]?r[ci.pts]/r[ci.poss]*100:null;
    h+=`<tr><td class="name">${esc(r[ci.defName])}</td><td class="l muted" style="font-family:Inter">${lbl}</td><td>${fmt(r[ci.poss],0)}</td><td>${r[ci.pts]??'–'}</td><td>${fmt(pp,0)}</td><td>${r[ci.fgm]}/${r[ci.fga]}</td><td>${r[ci.fg3m]}/${r[ci.fg3a]}</td><td>${r[ci.ast]??'–'}</td></tr>`});
  return h+`</tbody></table></div><p class="note">From NBA.com tracking: possessions where this defender was the primary matchup. Small samples are noisy — weight by possessions.</p></div>`;
}

let slip=store.get('slip',[]), slipBoost=store.get('slipBoost','');
function priceLeg(leg){
  const p=S.byId[leg.pid]; if(!p) return null;
  const ng=nextGameFor(p.teamId); const oppT=ng?S.teamById[oppOf(ng,p.teamId)]:null;
  const games=allGames(p.id);
  const of=oppFactorFor(p,oppT,leg.stat,games);
  const mates=matesOutFor(p);
  const proj=Model.project(games,leg.stat,{oppFactor:of.factor,mates}); if(!proj) return {p,ng,oppT,proj:null};
  const pr=Model.projProbs(leg.line,proj,!!Model.STATS[leg.stat].continuous);
  const pWin=leg.side==='under'?pr.under:pr.over;
  const odds=leg.odds>1?leg.odds:null;
  const implied=odds?1/odds:null;
  return {p,ng,oppT,proj,pWin,pPush:pr.push,odds,implied,fair:1/pWin,edge:implied!=null?pWin-implied:null,
    ev:odds?Model.expectedValue(pWin,odds,pr.push):null,mates};
}
function viewCalc(){
  const evS=x=>x==null?'–':`<span class="${x>0?'up':'down'}">${x>0?'+':''}${(x*100).toFixed(1)}%</span>`;

      <td class="l" data-l="Line"><input type="number" inputmode="decimal" step="0.5" data-leg="${i}" data-k="line" value="${l.line}" style="width:76px"></td>

      <td data-l="Proj.">${r.proj?fmt(r.proj.mean):'–'}</td>

      <td data-l="EV">${evS(r.ev)}${r.ev>0.08?` <span class="flag w" data-tip="Unusually big edge. Check injury news, minutes limits and that the line/odds are current before trusting it.">⚠</span>`:''}</td>

  // multi

  if(legs.length>=2){
    if(priced.length===legs.length){
      const pAll=priced.reduce((a,x)=>a*x.r.pWin,1);
      const odds=priced.reduce((a,x)=>a*x.r.odds,1);
      const b=parseFloat(slipBoost)||0;
      const boosted=1+(odds-1)*(1+b/100);
      const ev=pAll*boosted-1, evNo=pAll*odds-1;
      const games=priced.map(x=>x.r.ng?.id).filter(Boolean);
      const sameGame=games.length!==new Set(games).size;
      const breakEven=pAll>0?((1/pAll-1)/(odds-1)-1)*100:null;
      multi=`<div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Multi (${priced.length} legs)</h2>
        <label class="t2">Boost on winnings <input type="number" id="slipBoost" step="1" min="0" placeholder="0" value="${esc(slipBoost)}" style="width:70px"> %</label></div>
        <div class="stats">
          <div class="stat"><div class="k">Combined odds</div><div class="v">${fmt(odds,2)}</div><div class="d muted">${b?'boosted '+fmt(boosted,2):'no boost'}</div></div>
          <div class="stat"><div class="k">Model: all hit</div><div class="v">${pct(pAll,1)}</div><div class="d muted">fair odds ${fmt(1/pAll,2)}</div></div>
          <div class="stat"><div class="k">Book implied</div><div class="v">${pct(1/odds,1)}</div><div class="d muted">incl. margin on every leg</div></div>
          <div class="stat"><div class="k">EV no boost</div><div class="v">${evS(evNo)}</div><div class="d muted">per $1</div></div>
          <div class="stat"><div class="k">EV with boost</div><div class="v">${evS(ev)}</div><div class="d muted">per $1</div></div>
          <div class="stat"><div class="k">Boost to break even</div><div class="v">${breakEven!=null&&breakEven>0?fmt(breakEven,0)+'%':'none needed'}</div><div class="d muted">on winnings</div></div>
        </div>
        <div class="verdict">${ev>0.03?`✓ Positive with the boost: +${(ev*100).toFixed(1)}% expected return.`:ev>0?`Roughly break-even with the boost (+${(ev*100).toFixed(1)}%) — inside the model's error.`:`Negative even with the boost (${(ev*100).toFixed(1)}%). ${breakEven>0?`You'd need about a ${fmt(breakEven,0)}% boost to break even.`:''}`}</div>
        ${sameGame?`<p class="note" style="color:var(--text-2)">⚠ Two or more legs are from the same game. Their results are linked (e.g. a blowout hurts every starter), so the true chance of all hitting can differ from this — and same-game multis are usually priced with extra margin.</p>`:''}
        <p class="note">Assumes legs are independent. Filler legs: each one multiplies the model chance — four 97% legs together is only ${pct(Math.pow(.97,4),0)}.</p></div>`;
    } else multi=`<p class="note">Add odds to every leg to price the multi.</p>`;
  }
  return `<h1>Bet calculator</h1><p class="sub">Type any line — main or alt — and the bookie's odds. Edge = model probability minus the book's implied probability (with its margin still in, since you're only entering one side).</p>
  <div class="card"><div class="row" style="margin-bottom:12px"><div class="searchwrap" style="flex:1"><input type="text" id="psearch" placeholder="Add a leg — search a player…" autocomplete="off" style="width:100%"><div class="sugg" id="sugg" hidden></div></div>
    ${slip.length?'<button class="pill" id="slipClear">Clear all</button>':''}</div>
  ${slip.length?`<div class="tw calc"><table><thead><tr><th class="l">Player</th><th class="l">Stat</th><th class="l">Side</th><th class="l">Line</th><th class="l">Odds</th><th>Proj.</th><th>Model</th><th>Fair odds</th><th>Book</th><th>Edge</th><th>EV</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note">Projection includes tonight's opponent and any teammates listed out. Tap a name for the full breakdown.</p>`
  :`<div class="empty">Search a player above to add your first leg.</div>`}</div>${multi}`;
}

let safeTarget=store.get('safeTarget',0.95), safeStat=store.get('safeStat','ALL'), safeHideQ=store.get('safeHideQ',true);
const SAFE_STATS=['PTS','REB','AST','PRA','PR','PA','RA','FG3M'];
// alt-line ladders bookies actually offer ("10+" = over 9.5)
const LADDER={PTS:[10,15,20,25,30,35,40],REB:[4,6,8,10,12,14],AST:[3,5,7,9,11],FG3M:[1,2,3,4,5],
  PRA:[15,20,25,30,35,40,45,50],PR:[10,15,20,25,30,35,40],PA:[10,15,20,25,30,35,40],RA:[5,7,10,12,15]};
S.safeCache={};
function safeCandidates(games,target){
  const key=games.map(g=>g.id).join(',')+'|'+target+'|'+(S.injSource||'')+Object.keys(S.inj||{}).length;
  if(S.safeCache[key]) return S.safeCache[key];
  const out=[];
  games.forEach(g=>{[[g.away,g.home],[g.home,g.away]].forEach(([tid,opp])=>{
    const oppT=S.teamById[opp], myT=S.teamById[tid];
    const netGap=(myT?.adv?.NET_RATING??0)-(oppT?.adv?.NET_RATING??0);
    const b2b=isB2B(g,tid);
    S.players.filter(p=>p.teamId===tid&&(p.season?.MIN||0)>=24&&(p.season?.GP||0)>=5&&!isOut(p.id)).forEach(p=>{
      const gm=allGames(p.id); const cur=gm.filter(x=>x.season==='current');
      const m10=cur.slice(0,10).map(x=>x.min); const mAvg=m10.reduce((a,b)=>a+b,0)/m10.length;
      const mSd=Math.sqrt(m10.reduce((a,b)=>a+(b-mAvg)**2,0)/m10.length);
      const mates=matesOutFor(p);
      SAFE_STATS.forEach(st=>{
        const of=oppFactorFor(p,oppT,st,gm);
        const pr=Model.project(gm,st,{oppFactor:of.factor,mates}); if(!pr) return;
        let best=null;
        for(const step of LADDER[st]){const L=step-0.5; const q=Model.projProbs(L,pr).over; if(q>=target) best={line:L,p:q}; else break}
        if(!best) return;
        const last20=gm.slice(0,20), hits=last20.filter(x=>STATS[st].f(x)>best.line).length;
        const floor=Math.min(...gm.slice(0,15).map(x=>STATS[st].f(x)));
        const flags=[];
        if(isRisky(p.id)) flags.push(['q',injOf(p.id).status]);
        if(b2b) flags.push(['w','Back-to-back']);
        if(netGap>=8) flags.push(['w','Blowout risk (heavy favourite — starters may sit late)']);
        if(mSd>5) flags.push(['w',`Minutes swing a lot (±${mSd.toFixed(0)})`]);
        if(mates.length) flags.push(['i',`Adjusted for ${mates.map(m=>m.name).join(', ')} out`]);
        out.push({p,g,opp:oppT,st,line:best.line,prob:best.p,mean:pr.mean,hits,n:last20.length,floor,flags,home:g.home===tid});
      });
    });
  })});
  out.sort((a,b)=>b.prob-a.prob || a.flags.filter(f=>f[0]!=='i').length-b.flags.filter(f=>f[0]!=='i').length);
  return S.safeCache[key]=out;
}
function viewSafe(dateArg){
  const dates=[...new Set(S.sched.map(g=>melDate(g.utc)))].sort();
  if(!dates.length) return `<div class="card empty">No upcoming games loaded — run the updater to grab the schedule.</div>`;
  const today=new Date().toLocaleDateString('en-CA',{timeZone:TZ});
  const date=dateArg&&dates.includes(dateArg)?dateArg:(dates.find(d=>d>=today)||dates[dates.length-1]);
  const games=S.sched.filter(g=>melDate(g.utc)===date);
  let rows=safeCandidates(games,safeTarget);
  if(safeStat!=='ALL') rows=rows.filter(r=>r.st===safeStat);
  if(safeHideQ) rows=rows.filter(r=>!r.flags.some(f=>f[0]==='q'));
  rows=rows.slice(0,80);
  const flagHtml=f=>f.map(([k,t])=>`<span class="flag ${k}" data-tip="${esc(t)}">${k==='q'?'Q':k==='i'?'ⓘ':'⚠'}</span>`).join('');
  return `<h1>Safe legs · ${melDay(date)}</h1>
  <p class="sub">The highest line for each player and stat that the model rates at least ${Math.round(safeTarget*100)}% to go over. Compare <b>fair odds</b> with your bookie: if they offer more than fair, the leg is worth adding.</p>
  <div class="row" style="margin-bottom:12px">${dates.map(d=>`<a class="pill ${d===date?'on':''}" href="#/safe/${d}">${melDay(d)}</a>`).join('')}</div>
  <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px">
    <div class="row"><div class="seg" id="safeT">${[0.9,0.95,0.97].map(t=>`<button data-t="${t}" class="${t===safeTarget?'on':''}">${Math.round(t*100)}%+</button>`).join('')}</div>
    <div class="seg" id="safeS">${['ALL',...SAFE_STATS].map(x=>`<button data-s="${x}" class="${x===safeStat?'on':''}">${x==='ALL'?'All':x==='FG3M'?'3PM':x}</button>`).join('')}</div></div>
    <label class="t2"><input type="checkbox" id="safeQ" ${safeHideQ?'checked':''}> Hide questionable players</label></div>
  ${rows.length?`<div class="tw"><table><thead><tr><th class="l">Player</th><th class="l">Game</th><th class="l">Leg</th><th>Model</th><th>Fair odds</th><th>Projection</th><th>L20 hit</th><th>Floor L15</th><th class="l">Flags</th></tr></thead><tbody>
  ${rows.map(r=>`<tr class="click" data-href="#/player/${r.p.id}/${r.opp?.abbr||''}" data-safe="${r.st}:${r.line}">
    <td class="name">${esc(r.p.name)} ${injBadge(r.p.id)} <span class="tag">${esc(r.p.team)}</span></td><td class="l">${r.home?'vs':'@'} ${esc(r.opp?.abbr||'')}</td>
    <td class="l"><b>${r.line+0.5}+ ${r.st==='FG3M'?'3PM':r.st}</b> <span class="muted">(over ${r.line})</span></td>
    <td>${pct(r.prob,1)}</td><td><b>${fmt(1/r.prob,3)}</b></td><td>${fmt(r.mean)}</td>
    <td class="${r.hits===r.n?'up':r.hits/r.n<0.9?'down':''}">${r.hits}/${r.n}</td><td>${fmt(r.floor,0)}</td><td class="l">${flagHtml(r.flags)}</td></tr>`).join('')}</tbody></table></div>`
  :`<div class="empty">Nothing clears ${Math.round(safeTarget*100)}% with these filters.</div>`}
  <p class="note"><b>How to use:</b> a 1.01 leg needs the model to say about 99%+ to break even, so most 1.01 legs are slightly <i>negative</i>. They're only worth adding when the boost you unlock is bigger than that cost. Favour legs with no ⚠ flags, a floor above the line and a 20/20 hit record. Questionable players are hidden by default because an early injury exit counts as a loss at most bookies. Teammates listed Out are already factored in (ⓘ).</p></div>`;
}

function viewModel(){
  const c=S.calib;
  if(!c) return `<div class="card empty">Calibration results not found.</div>`;
  const W=420,H=380,pl=44,pb=40,pt=12,pr=12;
  const x=v=>pl+(W-pl-pr)*v, y=v=>H-pb-(H-pb-pt)*v;
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:520px;display:block" role="img" aria-label="Predicted vs actual hit rate">`;
  for(let i=0;i<=10;i+=2){const v=i/10; svg+=`<line x1="${x(0)}" x2="${x(1)}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${i*10}%</text><text x="${x(v)}" y="${H-pb+16}" font-size="11" text-anchor="middle" fill="var(--muted)">${i*10}%</text>`}
  svg+=`<line x1="${x(0)}" y1="${y(0)}" x2="${x(1)}" y2="${y(1)}" stroke="var(--text-2)" stroke-width="1.5" stroke-dasharray="4 4"/>
   <text x="${x(0.5)}" y="${H-6}" font-size="11.5" text-anchor="middle" fill="var(--text-2)">Model said</text>
   <text transform="translate(12,${y(0.5)}) rotate(-90)" font-size="11.5" text-anchor="middle" fill="var(--text-2)">Actually hit</text>`;
  const series=[['main','var(--s1)','Lines near the projection'],['alt','var(--s2)','Low alt lines (filler legs)']];
  series.forEach(([k,col])=>{
    const pts=c[k].buckets.filter(b=>b.n>=100);
    svg+=`<polyline fill="none" stroke="${col}" stroke-width="2" points="${pts.map(b=>`${x(b.predicted)},${y(b.actual)}`).join(' ')}"/>`;
    pts.forEach(b=>{svg+=`<circle cx="${x(b.predicted)}" cy="${y(b.actual)}" r="5" fill="${col}" stroke="var(--surface)" stroke-width="2" data-tip="Model said ${pct(b.predicted,1)}<br>Actually hit ${pct(b.actual,1)}<br>${b.n.toLocaleString()} predictions"/>`});
  });
  svg+='</svg>';
  const v=c.validation;
  const stat=(k,val,sub)=>`<div class="stat"><div class="k">${k}</div><div class="v">${val}</div><div class="d muted">${sub}</div></div>`;
  const imp=s=>((1-s.brier/s.brierBaseline)*100).toFixed(1);
  return `<h1>Model check</h1><p class="sub">Is the model honest? For every game this season and last, it predicted using <b>only the games before it</b>, then we checked what happened.</p>
  <div class="grid g2"><div class="card"><h2>When the model says X%, how often does it hit?</h2>${svg}
    <div class="legend">${series.map(([k,col,l])=>`<span><i style="background:${col}"></i>${l}</span>`).join('')}<span><i style="background:var(--text-2);height:2px"></i>Perfect calibration</span></div>
    <p class="note">Dots on the dashed line = the percentages mean what they say. Hover a dot for the numbers.</p></div>
  <div class="card"><h2>Headline numbers</h2><div class="stats">
    ${stat('Predictions tested',c.all.n.toLocaleString(),'2 seasons, walk-forward')}
    ${stat('"95%+" legs hit',pct(c.safe.actual,1),`model said ${pct(c.safe.predicted,1)} · n=${c.safe.n.toLocaleString()}`)}
    ${v?stat('Unseen-season check',pct(v.safe.actual,1),`"95%+" on ${v.season} games not used for tuning (said ${pct(v.safe.predicted,1)}, n=${v.safe.n})`):''}
    ${stat('vs "L10 hit rate"',imp(c.main)+'% better','Brier score, main lines (lower error)')}
  </div>
  <h2 style="margin-top:16px">By stat (main lines)</h2><div class="tw"><table><thead><tr><th class="l">Stat</th><th>Model error</th><th>L10 hit-rate error</th><th>Better by</th></tr></thead><tbody>
  ${Object.entries(c.byStat).map(([k,s])=>`<tr><td class="l" style="font-family:Inter">${k==='FG3M'?'3PM':k}</td><td>${s.brier.toFixed(4)}</td><td>${s.brierBaseline.toFixed(4)}</td><td class="up">${imp(s)}%</td></tr>`).join('')}</tbody></table></div>
  ${S.oppBt?(()=>{const none=S.oppBt.find(x=>!x.cfg), used=S.oppBt.find(x=>x.cfg&&x.cfg[0]===30&&x.cfg[1]===0.1), old=S.oppBt.find(x=>x.cfg&&x.cfg[0]===15);
    return `<h2 style="margin-top:16px">Opponent adjustment test</h2><div class="tw"><table><thead><tr><th class="l">Setting</th><th>Error (main lines)</th></tr></thead><tbody>
    ${S.oppBt.map(x=>`<tr><td class="l" style="font-family:Inter">${esc(x.name)}${x===used?' <span class="chip soft">in use</span>':''}</td><td>${x.brier.toFixed(5)}</td></tr>`).join('')}</tbody></table></div>
    <p class="note">Defence-vs-position rebuilt day by day from earlier games only. It helps, but only a little (${((1-used.brier/none.brier)*100).toFixed(2)}% lower error), so it's capped at ±10%.</p>`})():''}
  <p class="note">Brier score = average squared error of the probability (lower is better). The calibration chart tests the core projection; the opponent adjustment is tested separately above. Teammate-out adjustments can't be reconstructed for past games. Last run ${c.generated?new Date(c.generated).toLocaleDateString('en-AU'):''}.</p></div></div>
  <div class="card" style="margin-top:14px"><h2>What the model does and doesn't know</h2><div class="grid g2" style="gap:24px">
    <div><b class="up">Accounts for</b><ul class="t2"><li>Recent minutes (fast-reacting) and per-minute production (two seasons, recent weighted)</li><li>Opponent defence vs the player's position, shrunk for small samples</li><li>Teammates ruled out, using his real past games without them</li><li>Game-to-game spread, plus the chance of a dud game (injury exit, foul trouble, blowout)</li><li>Injury report: live from ESPN each time you open the site</li></ul></div>
    <div><b class="down">Doesn't know</b><ul class="t2"><li>Late scratches announced after the report, and confirmed starting lineups</li><li>Minutes restrictions, coach decisions, trades in the last day</li><li>Motivation, travel, altitude, referee tendencies</li><li>Live betting market moves — if the line has moved a lot, the market probably knows something</li></ul></div></div></div>`;
}

  document.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{const k=th.dataset.sort; todaySort={k,d:todaySort.k===k?-todaySort.d:-1}; store.set('todaySort',todaySort); route()});
  document.querySelectorAll('th[data-tsort]').forEach(th=>th.onclick=()=>{const k=th.dataset.tsort; teamSort={k,d:teamSort.k===k?-teamSort.d:-1}; store.set('teamSort',teamSort); route()});
  document.querySelectorAll('#dvpGrp button').forEach(b=>b.onclick=()=>{dvpGrp=b.dataset.g;store.set('dvpGrp',dvpGrp);route()});
  document.querySelectorAll('#dvpSpan button').forEach(b=>b.onclick=()=>{dvpSpan=b.dataset.sp;store.set('dvpSpan',dvpSpan);route()});
  document.querySelectorAll('#zoneSpan button').forEach(b=>b.onclick=()=>{zoneSpan=b.dataset.z;store.set('zoneSpan',zoneSpan);route()});
  document.querySelectorAll('#propN button').forEach(b=>b.onclick=()=>{propN=+b.dataset.n;store.set('propN',propN);route()});
  const ps=$('#propStat'); if(ps) ps.onchange=()=>{propStat=ps.value;store.set('propStat',propStat);route()};
  const pl=$('#propLine'); if(pl) pl.onchange=()=>{const parts=location.hash.split('/'); propLines[parts[2]+':'+propStat]=parseFloat(pl.value); store.set('propLines',propLines); route()};
  const saveOdds=()=>{const parts=location.hash.split('/'); const p=S.byId[parts[2]]; if(!p) return;
    const line=propLines[p.id+':'+propStat]??defaultLine(p,propStat); const key=p.id+':'+propStat+':'+line;
    const o=parseFloat($('#oddsO').value), u=parseFloat($('#oddsU').value);
    propOdds[key]={o:o>1?o:undefined,u:u>1?u:undefined}; store.set('propOdds',propOdds); route()};
  ['#oddsO','#oddsU'].forEach(id=>{const el=$(id); if(el) el.onchange=saveOdds});
  document.querySelectorAll('[data-mate]').forEach(b=>b.onclick=()=>{const parts=location.hash.split('/'); const p=S.byId[parts[2]]; const sel=getMateSel(p);
    const id=+b.dataset.mate; sel.has(id)?sel.delete(id):sel.add(id); route()});
  document.querySelectorAll('#safeT button').forEach(b=>b.onclick=()=>{safeTarget=+b.dataset.t;store.set('safeTarget',safeTarget);route()});
  document.querySelectorAll('#safeS button').forEach(b=>b.onclick=()=>{safeStat=b.dataset.s;store.set('safeStat',safeStat);route()});
  const sq=$('#safeQ'); if(sq) sq.onchange=()=>{safeHideQ=sq.checked;store.set('safeHideQ',safeHideQ);route()};
  document.querySelectorAll('[data-safe]').forEach(el=>el.onclick=()=>{const [st,l]=el.dataset.safe.split(':'); const pid=el.dataset.href.split('/')[2];
    propStat=st; store.set('propStat',st); propLines[pid+':'+st]=+l; store.set('propLines',propLines); location.hash=el.dataset.href});
  document.querySelectorAll('[data-leg]').forEach(el=>el.onchange=()=>{const i=+el.dataset.leg,k=el.dataset.k; let v=el.value;
    if(k==='line') v=parseFloat(v); if(k==='odds') v=parseFloat(v)>1?parseFloat(v):null;
    slip[i][k]=v; if(k==='stat'){const p=S.byId[slip[i].pid]; slip[i].line=defaultLine(p,v)} store.set('slip',slip); route()});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{slip.splice(+b.dataset.del,1); store.set('slip',slip); route()});
  const sc=$('#slipClear'); if(sc) sc.onclick=()=>{slip=[]; store.set('slip',slip); route()};
  const sb=$('#slipBoost'); if(sb) sb.onchange=()=>{slipBoost=sb.value; store.set('slipBoost',slipBoost); route()};
  const op=$('#oppPick'); if(op) op.onchange=()=>{const parts=location.hash.split('/'); location.hash=`#/player/${parts[2]}/${op.value}`};
  // search
  const inp=$('#psearch'), sg=$('#sugg');
  if(inp){
    let act=0, res=[];
    const render=()=>{sg.hidden=!res.length; sg.innerHTML=res.map((p,i)=>`<div class="${i===act?'act':''}" data-id="${p.id}"><span>${esc(p.name)}</span><span class="muted">${esc(p.team)}</span></div>`).join('');
      sg.querySelectorAll('div').forEach(d=>d.onmousedown=()=>pick(d.dataset.id))};
    inp.oninput=()=>{const q=normName(inp.value); act=0;
      res=q?S.players.filter(p=>normName(p.name).includes(q)).sort((a,b)=>(b.season?.MIN||0)-(a.season?.MIN||0)).slice(0,10):[]; render()};
    const pick=id=>{ if(r==='calc'){const p=S.byId[id]; slip.push({pid:p.id,stat:'PTS',side:'over',line:defaultLine(p,'PTS'),odds:null}); store.set('slip',slip); route(); setTimeout(()=>{const ins=document.querySelectorAll('[data-k="odds"]'); ins[ins.length-1]?.focus()},0)} else location.hash='#/player/'+id };
    inp.onkeydown=e=>{if(e.key==='ArrowDown'){act=Math.min(act+1,res.length-1);render();e.preventDefault()} else if(e.key==='ArrowUp'){act=Math.max(act-1,0);render();e.preventDefault()} else if(e.key==='Enter'&&res[act]) pick(res[act].id)};
    inp.onblur=()=>setTimeout(()=>sg.hidden=true,150);
    if(r==='player'&&!location.hash.split('/')[2]) inp.focus();
  }
}

load();
</script>
</body>
</html>
